<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Source International">
  <!--
    The "S&H" tile from LogoMark in src/component/site/Logo.tsx, redrawn as a
    standalone icon. Keep the gradient stops in sync with that component.
  -->
  <defs>
    <!-- Matches the component's linear-gradient(150deg, ...) -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1b4f8f" />
      <stop offset="55%" stop-color="#0d3a6b" />
      <stop offset="100%" stop-color="#07264a" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="8" fill="url(#tile)" />

  <text
    x="32"
    y="33"
    fill="#ffffff"
    font-family="Manrope, 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="31"
    font-weight="800"
    letter-spacing="-1.4"
    text-anchor="middle"
    dominant-baseline="central"
  >S&amp;H</text>
</svg>
